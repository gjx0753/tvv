name: EPG

on:
  schedule:
    - cron: '40 */2 * * *'  # 每2小时40分运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo sed -i 's|http://.*.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y jq libxml2-utils file curl xmltv-util

      - name: Check proxy configuration
        run: |
          if [ -n "$DOWNLOAD_PROXY" ]; then
            echo "✅ 已配置代理: $DOWNLOAD_PROXY"
          else
            echo "⚠️ 未配置DOWNLOAD_PROXY，仅能下载直连资源"
          fi
        env:
          DOWNLOAD_PROXY: ${{ secrets.DOWNLOAD_PROXY }}

      - name: Download and process EPG files
        run: |
          mkdir -p epg
          FAILED_FILES=""
          SUCCESS_COUNT=0
          TOTAL_COUNT=0
          
          # 读取files.json（假设格式为：{"files": [...]}）
          while read -r filename url; do
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            source_url="$url"
            request_url="$url"
            
            # 代理处理
            if [[ "$url" == proxy:* ]]; then
              source_url="${url#proxy:}"
              if [ -z "$DOWNLOAD_PROXY" ]; then
                echo "❌ 跳过: $filename（未配置代理 secrets.DOWNLOAD_PROXY）"
                FAILED_FILES="$FAILED_FILES\n$filename（未配置代理）"
                continue
              fi
              encoded_source_url=$(printf '%s' "$source_url" | jq -sRr @uri)
              request_url="${DOWNLOAD_PROXY}${encoded_source_url}"
              echo "🔄 下载: $filename (通过代理)"
            else
              echo "🔄 下载: $filename (直连)"
            fi
            
            # 下载文件
            xml_file="epg/$filename"
            if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 30 "$request_url" -o "$xml_file"; then
              # 验证XML
              if xmllint --noout "$xml_file" 2>/dev/null; then
                echo "✅ 成功: $filename"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                echo "⚠️ XML无效: $filename"
                FAILED_FILES="$FAILED_FILES\n$filename（XML格式错误）"
                rm -f "$xml_file"
              fi
            else
              echo "❌ 失败: $filename"
              FAILED_FILES="$FAILED_FILES\n$filename（下载失败）"
              rm -f "$xml_file"
            fi
            
          done < <(cat files.json | jq -r '.files[] | "\(.name) \(.url)"')
          
          # 统计报告
          echo -e "\n📊 下载统计: 成功 $SUCCESS_COUNT/$TOTAL_COUNT"
          
          if [ -n "$FAILED_FILES" ]; then
            echo -e "\n❌ 失败文件列表：\n$FAILED_FILES"
            exit 1
          else
            echo -e "\n✅ 所有文件下载成功"
          fi
        env:
          DOWNLOAD_PROXY: ${{ secrets.DOWNLOAD_PROXY }}

      - name: Merge EPG files
        if: success()
        run: |
          cd epg
          
          # 合并所有XML文件
          echo "🔄 合并EPG文件..."
          tv_merge -o /tmp/epg_merged.xml *.xml
          
          # 压缩输出
          gzip -c /tmp/epg_merged.xml > epg.xml.gz
          
          # 创建日期标记
          DATE=$(date +%Y%m%d)
          cp /tmp/epg_merged.xml "epg_${DATE}.xml"
          cp epg.xml.gz "epg_${DATE}.xml.gz"
          
          echo "✅ EPG文件已合并并压缩"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epg-data
          path: |
            epg/epg_merged.xml
            epg/epg.xml.gz
            epg/epg_*.xml*
          retention-days: 3

      - name: Cleanup old files
        if: success()
        run: |
          # 保留最近3天的文件，删除更早的
          find epg/ -name "*.xml" -mtime +3 -delete
          find epg/ -name "*.xml.gz" -mtime +3 -delete
          echo "✅ 已清理旧文件"
